<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';font-src 'self';img-src 'self';connect-src 'none';object-src 'none';form-action 'none'"><title>Kivou Island</title><link rel="stylesheet" href="island.css"></head><body><div id="pill"><button id="toggle" aria-expanded="false"><img src="mark.svg" alt=""><span id="label">Kivou is here</span><span id="light" aria-hidden="true"></span></button><section id="panel" hidden><h1>A little room to think.</h1><p id="connection-help">Connect your model in the workspace to ask a question.</p><form id="quick"><label for="quick-message">Your message</label><textarea id="quick-message" rows="2" maxlength="12000" required placeholder="What’s on your mind?"></textarea><label class="consent"><input id="quick-consent" type="checkbox" required>Send this message to the selected model. Saved memory is excluded.</label><button id="quick-send" disabled>Ask Kivou</button></form><button id="stop" hidden>Stop run</button><p id="error" role="status" hidden></p><button id="open">Open your workspace</button></section></div><script src="island.js"></script></body></html>
